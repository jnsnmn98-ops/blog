<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.bar { margin-top:48px; display:flex; height:120px; border-radius:16px; overflow:hidden; border:2px solid rgba(255,255,255,0.15); }
.seg { display:flex; align-items:center; justify-content:center; font-weight:800; font-size:30px; color:#1a1a2e; }
.s1 { width:16%; background:#f2c46d; }
.s2 { width:10%; background:#e58a6b; }
.s3 { width:10px; background:#6ee7c8; }
.s4 { flex:1; background: repeating-linear-gradient(135deg,#3a4260 0 14px,#323955 14px 28px); color:#c4cbe0; font-weight:600; font-size:24px; }
.labels { display:flex; margin-top:18px; font-size:22px; line-height:1.4; }
.labels div { flex:none; }
.legend { margin-top:44px; display:grid; grid-template-columns: 1fr 1fr; gap:18px; }
.lg { display:flex; gap:16px; align-items:flex-start; padding:22px 24px; border-radius:14px; background:rgba(255,255,255,0.05); }
.sw { width:22px; height:22px; border-radius:6px; flex:none; margin-top:4px; }
.lg .t { font-size:25px; font-weight:700; color:#fff; }
.lg .d { font-size:20px; color:#9aa4c2; margin-top:6px; line-height:1.5; }
.lg.wide { grid-column: 1 / 3; }
.zoom { margin-top:30px; border:2px dashed #6ee7c8; border-radius:16px; padding:26px 28px; }
.zoom .h { font-size:22px; color:#6ee7c8; font-weight:600; }
.zrow { display:flex; align-items:center; gap:18px; margin-top:16px; }
.zbar { flex:1; height:44px; border-radius:10px; overflow:hidden; display:flex; background:#2b3352; }
.zbar .in { width:14.29%; background:#6ee7c8; }
.zrow .v { font-size:26px; font-weight:800; color:#fff; white-space:nowrap; }
.zoom .note { margin-top:16px; font-size:21px; color:#c9d0e6; line-height:1.55; }
.zoom .note b { color:#f2c46d; }
</style></head><body>
<div id="cap" class="card">
  <div class="kicker"><span class="mono">01</span> · 원재료 구성</div>
  <h1>광동 침향환 프리미엄, 표시된 비율은 세 가지뿐</h1>
  <div class="bar">
    <div class="seg s1">16%</div><div class="seg s2">10%</div><div class="seg s3"></div>
    <div class="seg s4">나머지 원료 · 개별 비율 미공개</div>
  </div>
  <div class="legend">
    <div class="lg"><div class="sw" style="background:#f2c46d"></div><div><div class="t">침향분말 16%</div><div class="d">인도네시아산</div></div></div>
    <div class="lg"><div class="sw" style="background:#e58a6b"></div><div><div class="t">녹용분말 10%</div><div class="d">뉴질랜드산</div></div></div>
    <div class="lg"><div class="sw" style="background:#6ee7c8"></div><div><div class="t">침향추출에센스 0.1%</div><div class="d">막대에서는 얇은 선으로 표시</div></div></div>
    <div class="lg"><div class="sw" style="background:repeating-linear-gradient(135deg,#3a4260 0 5px,#58617f 5px 10px)"></div><div><div class="t">비율 미공개</div><div class="d">아카시아벌꿀 · 국산 한방 원료 분말 · 전통보감복합분말(홍삼 포함)</div></div></div>
  </div>
  <div class="zoom">
    <div class="h">에센스 0.1%를 확대하면</div>
    <div class="zrow"><div class="zbar"><div class="in"></div></div><div class="v">침향 14.29%</div></div>
    <div class="note"><b>14.29%</b>는 에센스 안에서 침향이 차지하는 비율이에요. 완제품 기준 침향분말 비율(16%)과는 기준이 달라요.</div>
  </div>
  <div class="foot">2026년 11월 3일 광동제약 공식 제품 페이지 표시 기준</div>
</div>
</body></html>
