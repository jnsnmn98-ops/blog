<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  h1 { text-align: center; }
  .node {
    width: 520px;
    margin: 0 auto;
    padding: 24px;
    border-radius: 14px;
    text-align: center;
    font-size: 36px;
    font-weight: 800;
  }
  .node.req { margin-top: 44px; background: var(--panel); border: 2px solid var(--line); }
  .node.hook { background: var(--claude); color: var(--on-color); }
  .down { display: block; margin: 0 auto; }
  .tree { display: block; }
  .cols {
    display: grid;
    grid-template-columns: repeat(3, 300px);
    column-gap: 26px;
  }
  .col { display: flex; flex-direction: column; align-items: stretch; }
  .code {
    padding: 20px 8px;
    border-radius: 14px;
    text-align: center;
    font-size: 34px;
    font-weight: 800;
    background: var(--panel);
    border: 2px solid var(--line);
  }
  .result {
    flex: 1;
    min-height: 196px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 26px 22px;
    border-radius: 14px;
    text-align: center;
    background: var(--panel);
    border: 2px solid var(--line);
  }
  .result b { display: block; font-size: 34px; font-weight: 800; line-height: 1.3; }
  .result span {
    display: block;
    margin-top: 14px;
    font-size: 27px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--muted);
  }
  .col.block .code { background: var(--hook); border-color: var(--hook); color: var(--on-color); }
  .col.block .result { border-color: var(--hook); }
  .col.block .result b { color: var(--hook); }
  .col.block .result span { color: var(--ink); }
  .foot { margin-top: 36px; text-align: center; font-size: 34px; font-weight: 800; }
  .foot em { font-style: normal; color: var(--hook); }
</style>
</head>
<body>
<div id="canvas">
  <h1>PreToolUse 훅의 판단 흐름</h1>
  <div class="node req">도구 실행 요청</div>
  <svg class="down" width="30" height="52" viewBox="0 0 30 52" fill="none">
    <path d="M15 4V42" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <path d="M4 32L15 48L26 32" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="node hook">PreToolUse 훅 실행</div>
  <svg class="tree" width="952" height="76" viewBox="0 0 952 76" fill="none">
    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M476 4V30"/>
      <path d="M150 62V30H802V62"/>
      <path d="M476 30V62"/>
      <path d="M140 54L150 70L160 54"/>
      <path d="M466 54L476 70L486 54"/>
      <path d="M792 54L802 70L812 54"/>
    </g>
  </svg>
  <div class="cols">
    <div class="col">
      <div class="code">종료 코드 0</div>
      <svg class="down" width="30" height="46" viewBox="0 0 30 46" fill="none">
        <path d="M15 4V36" stroke="#b8bfd0" stroke-width="4" stroke-linecap="round"/>
        <path d="M6 28L15 42L24 28" stroke="#b8bfd0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="result"><b>평소 권한 흐름</b><span>0은 승인이 아닙니다</span></div>
    </div>
    <div class="col block">
      <div class="code">종료 코드 2</div>
      <svg class="down" width="30" height="46" viewBox="0 0 30 46" fill="none">
        <path d="M15 4V36" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
        <path d="M6 28L15 42L24 28" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="result"><b>차단</b><span>이유가 Claude에게 전달됩니다</span></div>
    </div>
    <div class="col">
      <div class="code">그 밖의 코드</div>
      <svg class="down" width="30" height="46" viewBox="0 0 30 46" fill="none">
        <path d="M15 4V36" stroke="#b8bfd0" stroke-width="4" stroke-linecap="round"/>
        <path d="M6 28L15 42L24 28" stroke="#b8bfd0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="result"><b>대부분 비차단 오류</b><span>동작이 계속됩니다</span></div>
    </div>
  </div>
  <div class="foot">정책을 강제할 때는 1이 아니라 <em>2</em>를 씁니다</div>
</div>
</body>
</html>
